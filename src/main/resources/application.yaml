server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/insuranceApp
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    com.endava.insuranceapp: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: debug
