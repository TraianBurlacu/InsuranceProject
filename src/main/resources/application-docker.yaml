server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://db:5432/insuranceApp
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    com.endava.insuranceapp: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: debug